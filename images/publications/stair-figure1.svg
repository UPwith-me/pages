<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="680" viewBox="0 0 1600 680">
  <title>STAIR computation within a controlled Transformer block</title>
  <desc>Past inference forms a shared read-only bank. Current queries produce reference and reflected reads. Their difference passes through the frozen output path and enters the native residual stream before the MLP.</desc>
  <defs>
    <marker id="arrow-native" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#4b5560"/>
    </marker>
    <marker id="arrow-side" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#287b85"/>
    </marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #202832; }
      .label { font-size: 23px; text-anchor: middle; }
      .detail { font-size: 18px; text-anchor: middle; fill: #59636d; }
      .math { font-family: Cambria, "Times New Roman", serif; font-size: 27px; font-style: italic; }
      .native-box { fill: #fff; stroke: #59636d; stroke-width: 1.7; }
      .side-box { fill: #fff; stroke: #287b85; stroke-width: 1.7; }
      .wire-native { fill: none; stroke: #4b5560; stroke-width: 2.1; stroke-linejoin: round; marker-end: url(#arrow-native); }
      .wire-side { fill: none; stroke: #287b85; stroke-width: 2.1; stroke-linejoin: round; marker-end: url(#arrow-side); }
      .branch { fill: none; stroke: #287b85; stroke-width: 2.1; stroke-linejoin: round; }
    </style>
  </defs>

  <rect width="1600" height="680" fill="#fff"/>

  <!-- History capture and the shared bank. -->
  <rect x="40" y="30" width="230" height="82" rx="4" class="native-box"/>
  <text x="155" y="66" class="label">
    <tspan x="155">Past assistant</tspan>
    <tspan x="155" dy="28">inference</tspan>
  </text>
  <path d="M270 71 H445" class="wire-side"/>
  <rect x="445" y="30" width="360" height="82" rx="4" fill="#f5fafb" stroke="#287b85" stroke-width="1.7"/>
  <text x="625" y="64" class="label">Read-only stale bank</text>
  <text x="625" y="92" class="detail">K (pre-RoPE) and V</text>
  <path d="M625 112 V190" class="wire-side"/>

  <!-- Both reads share the identical stored K/V. -->
  <rect x="400" y="190" width="450" height="315" rx="5" fill="#f5fafb" stroke="#a9cbd0" stroke-width="1.4" stroke-dasharray="6 5"/>
  <text x="625" y="224" class="label" style="font-size:21px;fill:#287b85">Same-bank reads</text>

  <rect x="432" y="248" width="386" height="72" rx="4" class="side-box"/>
  <text x="625" y="293" class="label">Reference read</text>

  <rect x="432" y="366" width="386" height="103" rx="4" fill="#fff5ef" stroke="#b96f4b" stroke-width="1.7"/>
  <text x="625" y="394" class="label">Reflected read</text>
  <text x="625" y="426" class="math" text-anchor="middle">
    <tspan>q</tspan><tspan baseline-shift="sub" font-size="18">R</tspan><tspan baseline-shift="baseline"> = R</tspan><tspan baseline-shift="sub" font-size="18">u</tspan><tspan baseline-shift="baseline">q = q &#x2212; 2u(u</tspan><tspan baseline-shift="super" font-size="17">T</tspan><tspan baseline-shift="baseline">q)</tspan>
  </text>
  <text x="625" y="454" class="detail" style="fill:#975332">Learned normal u</text>

  <!-- The query splits into parallel reference and reflected reads. -->
  <rect x="40" y="310" width="230" height="86" rx="4" class="side-box"/>
  <text x="155" y="346" class="label">Current query q</text>
  <text x="155" y="375" class="detail">Frozen projection</text>
  <path d="M270 353 H326" class="branch"/>
  <circle cx="326" cy="353" r="3" fill="#287b85"/>
  <path d="M326 353 V284 H432" class="wire-side"/>
  <path d="M326 353 V418 H432" class="wire-side"/>
  <text x="367" y="271" class="math">q</text>
  <text x="367" y="405" class="math">q</text>

  <!-- Separate readouts enter the difference without a wire crossing. -->
  <path d="M818 284 H896 V296 H935" class="wire-side"/>
  <path d="M818 418 H896 V326 H935" class="wire-side"/>
  <text x="859" y="269" class="math">
    <tspan>r</tspan><tspan baseline-shift="sub" font-size="17">ref</tspan>
  </text>
  <text x="859" y="403" class="math">
    <tspan>r</tspan><tspan baseline-shift="sub" font-size="17">R</tspan>
  </text>

  <rect x="935" y="271" width="260" height="80" rx="4" class="side-box"/>
  <text x="1065" y="320" class="math" text-anchor="middle" style="font-size:29px">
    <tspan>&#x0394;r = r</tspan><tspan baseline-shift="sub" font-size="18">R</tspan><tspan baseline-shift="baseline"> &#x2212; r</tspan><tspan baseline-shift="sub" font-size="18">ref</tspan>
  </text>

  <!-- The difference is projected before entering the native stream. -->
  <path d="M1065 351 V408" class="wire-side"/>
  <rect x="935" y="408" width="260" height="90" rx="4" class="side-box"/>
  <text x="1065" y="439" class="label" style="font-size:22px">Frozen output path</text>
  <text x="1065" y="465" class="detail" style="font-size:17px">Native gate when present</text>
  <text x="1065" y="486" class="detail" style="font-size:17px">
    <tspan>then W</tspan><tspan baseline-shift="sub" font-size="12">O</tspan>
  </text>
  <path d="M1065 498 V562" class="wire-side"/>
  <text x="1080" y="538" class="math">&#x0394;x</text>

  <!-- Native computation remains a straight left-to-right path. -->
  <rect x="40" y="540" width="230" height="90" rx="4" class="native-box"/>
  <text x="155" y="578" class="label" style="font-size:22px">
    <tspan x="155">Current ordinary</tspan>
    <tspan x="155" dy="29">context and token</tspan>
  </text>
  <path d="M155 540 V396" class="wire-side"/>
  <path d="M270 585 H400" class="wire-native"/>

  <rect x="400" y="540" width="300" height="90" rx="4" class="native-box"/>
  <text x="550" y="594" class="label">Frozen native attention</text>
  <path d="M700 585 H1042" class="wire-native"/>

  <circle cx="1065" cy="585" r="23" fill="#fff" stroke="#59636d" stroke-width="1.8"/>
  <path d="M1056 585 H1074 M1065 576 V594" fill="none" stroke="#3b4651" stroke-width="2"/>
  <path d="M1088 585 H1140" class="wire-native"/>

  <rect x="1140" y="540" width="210" height="90" rx="4" class="native-box"/>
  <text x="1245" y="594" class="label">Frozen MLP</text>
  <path d="M1350 585 H1410" class="wire-native"/>

  <rect x="1410" y="540" width="150" height="90" rx="4" class="native-box"/>
  <text x="1485" y="578" class="label">
    <tspan x="1485">Next frozen</tspan>
    <tspan x="1485" dy="29">block</tspan>
  </text>
</svg>
