research:
  - title: "LLM Reasoning"
    text: >-
      Understanding and improving the mechanisms and computation underlying
      multi-step reasoning in large language models.
  - title: "Transformer Architectures"
    text: >-
      Exploring architectural choices that make Transformer-based models more
      effective and computationally efficient.
  - title: "Post-Training"
    text: >-
      Studying how objectives, data, and optimization after pretraining shape
      reasoning, alignment, and generalization.
  - title: "Multimodal AI Safety"
    text: >-
      Evaluating and improving the robustness and safety of models that operate
      across multiple modalities.

