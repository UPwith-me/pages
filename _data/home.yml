  intro:
    - >-
      I am an undergraduate student at Renmin University of China, interested in
      building more capable, efficient, and reliable foundation models.
    - >-
      My research interests span **LLM reasoning, Transformer architectures,
      post-training, and multimodal AI safety**. Broadly, I am interested in
      understanding how foundation models reason, how their computation can be
      made more effective, how post-training shapes their capabilities, and how
      these systems can remain reliable across modalities.
